# สร้างแอป Android (APK) ของเกม Dummy Online ให้อัตโนมัติ (Capacitor ห่อหน้าเว็บใน client/public)
# รันเมื่อมีการแก้ client/public/, mobile/ หรือไฟล์นี้ — หรือกด Actions → "Build Android APK (Dummy Online)" → Run workflow เอง
# ได้ไฟล์ .apk 2 ที่: (1) หน้า Releases ของ repo (โหลดผ่านมือถือได้เลย) (2) Artifacts ของ run นั้น
# ที่อยู่เซิร์ฟเวอร์: ใช้ค่าใน client/public/config.js เว้นแต่ตั้ง repo variable BACKEND_URL (Settings → Secrets and variables → Actions → Variables)
#                   หรือกรอกตอนกด Run workflow ด้วยตัวเอง
name: Build Android APK (Dummy Online)

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'URL เซิร์ฟเวอร์เกม (เว้นว่าง = ใช้ค่าใน config.js / repo variable BACKEND_URL)'
        required: false
        default: ''
  push:
    paths:
      - 'client/public/**'
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write   # สร้าง Release แนบไฟล์ APK

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: ตรวจไวยากรณ์โค้ด client (ต้องผ่านก่อนสร้างแอป)
        run: |
          node --check client/public/app.js
          node --check client/public/games.js
          node --check client/public/native.js
          node --check mobile/prepare.js

      - name: ติดตั้ง Capacitor
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: เตรียมไฟล์เว็บสำหรับแอป
        run: node mobile/prepare.js www
        env:
          BACKEND_URL: ${{ inputs.backend_url || vars.BACKEND_URL }}

      - name: สร้างโปรเจกต์ Android
        working-directory: mobile
        run: npx cap add android

      - name: ใส่ไอคอนและเลขเวอร์ชัน
        run: node mobile/prepare.js android

      - name: ซิงก์ไฟล์เว็บเข้าโปรเจกต์ Android
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: ตั้งชื่อไฟล์ APK
        run: |
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "dist/DummyOnline-${{ github.run_number }}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: DummyOnline-apk
          path: dist/*.apk

      - name: แนบ APK ใน Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Dummy Online (Android) #${{ github.run_number }}
          body: "APK ของเกม Dummy Online (สร้างอัตโนมัติ) — โหลดไฟล์ .apk ด้านล่างแล้วติดตั้งบน Android (ต้องอนุญาต 'ติดตั้งจากแหล่งอื่น') ต้องต่อเน็ตเพื่อเล่น"
          files: dist/*.apk
          prerelease: true
