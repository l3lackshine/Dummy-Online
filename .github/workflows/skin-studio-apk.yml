# สร้างแอป Skin Studio (APK) ให้อัตโนมัติ
# รันเมื่อมีการแก้ไฟล์ใน tools/skin-studio/ หรือกด Actions → "Build Skin Studio APK" → Run workflow เอง
# ได้ไฟล์ .apk 2 ที่: (1) หน้า Releases ของ repo (โหลดผ่านมือถือได้เลย) (2) Artifacts ของ run นั้น
name: Build Skin Studio APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/skin-studio/**'
      - '.github/workflows/skin-studio-apk.yml'

permissions:
  contents: write   # สร้าง Release แนบไฟล์ APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ทดสอบแกนหลักของแอป (ต้องผ่านก่อนสร้าง APK)
        run: |
          node tools/skin-studio/test/test-core.js
          node tools/skin-studio/test/test-app.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle -p tools/skin-studio :app:assembleDebug --no-daemon --stacktrace

      - name: ตั้งชื่อไฟล์ APK
        run: |
          mkdir -p dist
          cp tools/skin-studio/app/build/outputs/apk/debug/app-debug.apk "dist/SkinStudio-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SkinStudio-apk
          path: dist/*.apk

      - name: แนบ APK ใน Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: skin-studio-${{ github.run_number }}
          name: Skin Studio #${{ github.run_number }}
          body: "APK ของ Skin Studio (สร้างอัตโนมัติ) — โหลดไฟล์ .apk ด้านล่างแล้วติดตั้งบน Android (ต้องอนุญาต 'ติดตั้งจากแหล่งอื่น')"
          files: dist/*.apk
          prerelease: true
