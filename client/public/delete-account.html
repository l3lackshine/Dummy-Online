<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ลบบัญชี · ไพ่ดัมมี่ออนไลน์</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1ea;--card:#fffaf2;--ink:#2f3445;--mute:#6b7184;--red:#c8424f;--line:#e6dccb}
@media (prefers-color-scheme:dark){:root{--bg:#17131f;--card:#211b2c;--ink:#ece6f3;--mute:#a9a3b8;--red:#ff6b78;--line:#3a3148}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Sarabun,sans-serif}
main{max-width:460px;margin:0 auto;padding:28px 16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:20px}
h1{margin:0 0 6px;font-size:24px;color:var(--red)}label{display:flex;flex-direction:column;gap:4px;margin-top:12px;font-weight:600}
input{font:600 16px Sarabun,sans-serif;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink)}
button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--red);color:#fff;font:800 17px Sarabun,sans-serif;cursor:pointer}
button:disabled{opacity:.5;cursor:default}.msg{min-height:1.4em;margin-top:10px;font-weight:700}.err{color:var(--red)}.ok{color:#2e9a5a}
ul{padding-left:20px;margin:6px 0}small{color:var(--mute)}a{color:inherit}
</style></head><body><main><div class=card>
<h1>ลบบัญชีถาวร</h1>
<p>เข้าสู่ระบบด้วยบัญชีที่ต้องการลบ ข้อมูลต่อไปนี้จะถูกลบทันทีและ<b>กู้คืนไม่ได้</b></p>
<ul><li>เหรียญ เพชร และของในช่องเก็บของ</li><li>ตัวละคร ดาว และกรอบการ์ด</li><li>สถิติ ประวัติเกม ประวัติกาชา และเควส</li></ul>
<label>ชื่อผู้ใช้<input id=u autocomplete=username autocapitalize=off spellcheck=false></label>
<label>รหัสผ่าน<input id=p type=password autocomplete=current-password></label>
<label>พิมพ์ชื่อผู้ใช้อีกครั้งเพื่อยืนยัน<input id=c autocomplete=off autocapitalize=off spellcheck=false></label>
<button id=go disabled>ลบบัญชีของฉัน</button>
<div class=msg id=m></div>
<small>รายละเอียดอยู่ใน <a href="./privacy.html">นโยบายความเป็นส่วนตัว</a></small>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="./config.js"></script>
<script>
(function () {
  const C = window.DUMMY_CONFIG || {}, $ = id => document.getElementById(id), m = $('m'), go = $('go');
  const DOMAIN = String(C.AUTH_EMAIL_DOMAIN || 'example.com').replace(/^@/, '');
  const emailOf = u => (u.includes('@') ? u.toLowerCase() : u.toLowerCase() + '@' + DOMAIN);
  const say = (t, ok) => { m.textContent = t; m.className = 'msg ' + (ok ? 'ok' : 'err'); };
  if (!(window.supabase && C.SUPABASE_URL && C.SUPABASE_KEY)) { say('ระบบบัญชียังไม่เปิดใช้งาน'); return; }
  const sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_KEY, { auth: { persistSession: false } });
  const check = () => { const u = $('u').value.trim(); go.disabled = !(u && $('p').value && $('c').value.trim().toLowerCase() === u.toLowerCase()); };
  ['u', 'p', 'c'].forEach(id => $(id).addEventListener('input', check));
  go.onclick = async () => {
    const u = $('u').value.trim(); go.disabled = true; say('กำลังตรวจสอบ…', true);
    const { error: e1 } = await sb.auth.signInWithPassword({ email: emailOf(u), password: $('p').value });
    if (e1) { say('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'); check(); return; }
    const { error: e2 } = await sb.rpc('delete_my_account', { p_confirm: $('c').value.trim() });
    if (e2) { say(e2.message || 'ลบไม่สำเร็จ ลองใหม่อีกครั้ง'); await sb.auth.signOut(); check(); return; }
    await sb.auth.signOut(); say('ลบบัญชีเรียบร้อยแล้ว', true); ['u', 'p', 'c'].forEach(id => { $(id).value = ''; $(id).disabled = true; });
  };
})();
</script></body></html>
